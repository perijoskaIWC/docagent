# Build and test on every pull request and on every push to main (guide 1 §6.1).
# Evals don't run here (cost and time); they get their own manual workflow later (guide 2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  web:
    name: Web build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci              # installs exactly what package-lock.json lists
      - run: npm run build       # type check (tsc) and production build
      - run: npm run lint

  agent-instructions:
    name: Agent instructions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: AGENTS.md and .github/copilot-instructions.md are identical
        run: cmp AGENTS.md .github/copilot-instructions.md
